[project]
name = "jobapplier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RGProjectX", email = "rgprojects68@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pycryptodome>=3.23.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
jobapplier = "jobapplier:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
